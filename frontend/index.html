<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM CT-MAR | Khử Nhiễu Kim Loại</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 950px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 14px; }
        .upload-section { margin: 25px 0; padding: 20px; border: 2px dashed #475569; border-radius: 8px; background: #0f172a; }
        input[type="file"] { display: none; }
        .btn-select { background: #3b82f6; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-select:hover { background: #2563eb; }
        .btn-process { background: #10b981; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-left: 10px; }
        .btn-process:hover { background: #059669; }
        #status { margin-top: 15px; font-weight: bold; color: #f59e0b; min-height: 24px; }
        .canvas-grid { display: flex; justify-content: space-around; margin-top: 25px; flex-wrap: wrap; gap: 20px; }
        .canvas-card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        canvas { background: #000; width: 400px; height: 400px; border-radius: 4px; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hệ Thống Khử Nhiễu Kim Loại CT-MAR</h1>
        <p>Mô hình U-Net 2-channel tự động tạo mask & loại bỏ nhiễu kim loại</p>

        <div class="upload-section">
            <label for="fileInput" class="btn-select">Chọn File .RAW</label>
            <input type="file" id="fileInput">
            <span id="fileName" style="margin-left: 10px; color: #cbd5e1;">Chưa chọn file</span>
            <button class="btn-process" onclick="processImage()">Gửi Xử Lý</button>
            <div id="status"></div>
        </div>

        <div class="canvas-grid">
            <div class="canvas-card">
                <h3>Ảnh Đầu Vào (Artifact)</h3>
                <canvas id="canvasInput" width="512" height="512"></canvas>
            </div>
            <div class="canvas-card">
                <h3>Kết Quả (Khử Nhiễu U-Net)</h3>
                <canvas id="canvasOutput" width="512" height="512"></canvas>
            </div>
        </div>
    </div>

    <script>
        // DÁN LINK RENDER CỦA BẠN VÀO ĐÂY (Lưu ý có /predict ở cuối):
        // ✅ BẮT BUỘC có https:// ở đầu và có /predict ở cuối:
        const API_URL = "https://aapm-unet-backend.onrender.com/predict";

        const fileInput = document.getElementById('fileInput');
        const fileNameSpan = document.getElementById('fileName');
        const statusDiv = document.getElementById('status');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                fileNameSpan.textContent = e.target.files[0].name;
            }
        });

        async function processImage() {
            if (!fileInput.files[0]) {
                alert("Vui lòng chọn file .raw!");
                return;
            }

            const file = fileInput.files[0];
            statusDiv.textContent = "Đang đọc file...";

            const arrayBuffer = await file.arrayBuffer();
            const rawData = new Float32Array(arrayBuffer);

            if (rawData.length !== 512 * 512) {
                alert("Kích thước file không đúng 512x512!");
                statusDiv.textContent = "";
                return;
            }
            renderToCanvas(rawData, 'canvasInput');

            statusDiv.textContent = "Đang gửi file sang AI Model xử lý...";
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error("Server xử lý thất bại!");

                const resBuffer = await response.arrayBuffer();
                const predData = new Float32Array(resBuffer);

                renderToCanvas(predData, 'canvasOutput');
                statusDiv.textContent = "Xử lý thành công!";
            } catch (err) {
                statusDiv.textContent = "Lỗi: " + err.message;
            }
        }

        function renderToCanvas(dataFloat32, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(512, 512);

            const minHU = -1000, maxHU = 3000;
            for (let i = 0; i < dataFloat32.length; i++) {
                let val = (dataFloat32[i] - minHU) / (maxHU - minHU) * 255;
                val = Math.max(0, Math.min(255, val));
                const idx = i * 4;
                imgData.data[idx] = val;     // Red
                imgData.data[idx + 1] = val; // Green
                imgData.data[idx + 2] = val; // Blue
                imgData.data[idx + 3] = 255; // Alpha
            }
            ctx.putImageData(imgData, 0, 0);
        }
    </script>
</body>
</html>
